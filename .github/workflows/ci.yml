name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # oxidevm-bridge lives in the SDK repository (crates/oxidevm-bridge) until it is on crates.io.
      - uses: actions/checkout@v4
        with:
          repository: spacia-ai/oxidevm-sdk-public
          path: .sdk
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup show && rustup target add wasm32-wasip1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: echo "OXIDEVM_BRIDGE_PATH=$GITHUB_WORKSPACE/.sdk/crates/oxidevm-bridge" >> "$GITHUB_ENV"
      - run: pnpm run build:rust
      - run: git diff --exit-code -- upstream
      - run: pnpm run inspect:fixtures
      - run: cargo fmt --all -- --check
      - run: node scripts/cargo.ts clippy --workspace --all-targets --target wasm32-wasip1 -- -D warnings
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:conformance
