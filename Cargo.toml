[workspace]
resolver = "3"
members = ["examples/*", "test/fixtures/rust/*"]

# The bridge crate lives with the SDK (spacia-ai/oxidevm-sdk, crates/oxidevm-bridge) and is published to crates.io.
# Until it is, scripts/cargo.ts points Cargo at a checkout of it: OXIDEVM_BRIDGE_PATH=<sdk>/crates/oxidevm-bridge.
[workspace.dependencies]
oxidevm-bridge = "0.1"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "debuginfo"
