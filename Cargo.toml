[workspace]
resolver = "3"
members = ["examples/*", "test/fixtures/rust/*"]

# The bridge crate is developed with the SDK (crates/oxidevm-bridge) and published to crates.io. To try an unreleased
# change, OXIDEVM_BRIDGE_PATH=<sdk>/crates/oxidevm-bridge makes scripts/cargo.ts and build:rust use that checkout.
[workspace.dependencies]
oxidevm-bridge = "0.1"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "debuginfo"
