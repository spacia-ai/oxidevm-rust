[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "test/fixtures/rust/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "debuginfo"
